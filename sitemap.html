const REMOVED = ["Disclosure Management", "Workday", "Collaboration", "Legacy Consoles"];
function render(n, depth){
  const el=document.createElement('div'); el.className='node';
  const box=document.createElement('div'); box.className='box '+(depth===1?'l1':depth===2?'l2':'t'+n.tier);
  const t=TIER[n.tier]; const sub=[n.sub,t].filter(Boolean).join(' · ');
  const count=n.kids.length?(n.kids.length+(n.hidden?'+'+n.hidden:'')):(n.hidden?'+'+n.hidden:'');
  box.innerHTML='<span class="n">'+n.name+'</span>'+(sub?'<span class="s">'+sub+'</span>':'')+(count?'<span class="c">'+count+'</span>':'');
  el.appendChild(box);
  if(n.kids.length){const k=document.createElement('div');k.className='kids';n.kids.forEach(c=>k.appendChild(render(c,depth+1)));el.appendChild(k);
    box.addEventListener('click',e=>{e.stopPropagation();el.classList.toggle('collapsed')});
    if(depth>=2) el.classList.add('collapsed');}
  return el;
}
let view='proposed';
function draw(){const root=DATA[view];const tree=document.getElementById('tree');tree.innerHTML='';root.kids.forEach(c=>tree.appendChild(render(c,1)));
