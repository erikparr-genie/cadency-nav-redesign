<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadency navigation mock-up</title>
<style>
/* Current Cadency look and feel, measured from UAT01 on Nov 20, 2026: white 50px top bar, bold navy tabs (#003865), active tab navy with white text,
   245px dark grey sidebar (#4B4F54) with a magenta toggle (#910048), Arial 12px, grey page background (#F6F6F6), white panels with grey headers. */
:root{--navy:#003865;--teal:#008578;--magenta:#910048;--side:#4b4f54;--side-hover:#3d4044;--bg:#f6f6f6;--panel-head:#ebebeb;--line:#dddddd;--ink:#363636;--ink2:#555;--link:#0d6efd;--blue:#1f7ae0;--amber:#e9b32c;--grey-txt:#777;
 --t1:#13766f;--t2:#3da89d;--t3:#7ad8cc;--t4:#b5f2ea;--t5:#eafefd;--tn:#d9d9d9;--tz:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 Arial,"Helvetica Neue",Helvetica,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
#top{position:fixed;top:0;left:0;right:0;height:50px;background:#fff;border-bottom:1px solid #e3e3e3;display:flex;align-items:stretch;z-index:20;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#top .logo{flex:0 0 245px;display:flex;align-items:center;padding-left:48px}
#top .logo img{height:38px}
#tabs{display:flex;align-items:stretch;list-style:none;margin:0;padding:0}
#tabs li a{display:flex;align-items:center;height:50px;padding:0 11px;font-weight:700;font-size:14.5px;color:var(--navy);white-space:nowrap}
#tabs li a:hover{text-decoration:none;background:#f1f4f8}
#tabs li.on a{background:var(--navy);color:#fff}
#tabs li.sep{width:1px;background:#e3e3e3;margin:10px 4px}
#top .right{margin-left:auto;display:flex;align-items:center;gap:16px;padding-right:24px;flex:0 0 auto}
#top .mock{background:var(--amber);color:#2b2b2b;font-weight:700;font-size:13px;padding:0 16px;height:50px;display:flex;align-items:center;white-space:nowrap;cursor:pointer}#top .mock span{font-weight:400;margin-left:8px;text-decoration:underline}
#top .help{width:18px;height:18px;border-radius:50%;border:2px solid var(--teal);color:var(--teal);font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
#top .user{color:var(--teal);font-weight:700;font-size:13.5px;cursor:pointer;position:relative;white-space:nowrap}
#top .user .menu{display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:170px;padding:6px 0}
#top .user.open .menu{display:block}
#top .user .menu a{display:block;padding:7px 14px;color:var(--ink);font-weight:400;font-size:13px}
#top .user .menu a:hover{background:#f1f4f8;text-decoration:none}
#side{position:fixed;top:50px;left:0;bottom:0;width:245px;background:var(--side);color:#fff;overflow:auto;z-index:10;transition:width .15s}
#side.closed{width:0}
#toggle{position:fixed;top:62px;left:245px;width:25px;height:48px;background:var(--magenta);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:11;font-size:14px;transition:left .15s}
#side.closed + #toggle{left:0}
#side .sec{padding:14px 20px 6px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.2px}
#side .sec span{font-size:10px;margin-left:6px}#side .sec.g{font-size:14px;color:#fff;padding-top:16px}
#side a.it{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;font-size:14px;min-height:30px;padding:5px 16px 5px 35px;line-height:1.3}#side a.it .lab{min-width:0}
#side a.it:hover{background:var(--side-hover);text-decoration:none}
#side a.it.on{background:var(--side-hover)}
#side a.it.l4{padding-left:52px;font-size:13px;color:#e4e4e4}
#side a.it .chev{font-size:11px;opacity:.8}
#side .foot{display:none}
#main{margin-left:245px;padding:64px 40px 40px 44px;min-height:100vh;transition:margin .15s}
#side.closed ~ #main{margin-left:0}
h1.pt{font-size:26px;font-weight:400;margin:0 0 14px;color:#222;padding-bottom:10px;border-bottom:1px solid #ddd}
.dateline{position:absolute;right:40px;top:58px;font-size:12px;color:#555}
body.nosb #side,body.nosb #toggle{display:none}body.nosb #main{margin-left:0;padding-left:40px}
.sub{color:var(--grey-txt);font-size:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--link)}
.entitybar{background:#e4e4e4;padding:8px 14px;margin:0 0 16px;display:flex;gap:18px;align-items:center;font-size:12px}
.entitybar select{font:inherit;font-size:12px}
.grid{display:grid;gap:14px;align-items:start}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.panel{background:#fff;border:1px solid var(--line)}
.panel{border-radius:3px}.panel .ph{background:var(--panel-head);padding:11px 12px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;min-height:44px}.panel .ph a.t{color:var(--ink);font-size:16px}.panel .ph a.t:hover{color:var(--link)}
.panel .ph a{font-size:12px;font-weight:700}
.panel .pb{padding:12px}
.panel .pb p{margin:0 0 8px}
.ph .q{display:inline-block;width:14px;height:14px;border-radius:50%;background:#555;color:#fff;font-size:10px;text-align:center;line-height:14px;margin-left:6px;font-weight:700}
.list a{display:block;padding:6px 0;font-size:14px;font-weight:700}
.list a:last-child{border-bottom:0}
.tier{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:700;border:1px solid #999;color:#222;margin-left:6px;vertical-align:middle}
.dot{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid #888;margin-left:7px;vertical-align:-1px}.dot.t1{background:var(--t1)}.dot.t2{background:var(--t2)}.dot.t3{background:var(--t3)}.dot.t4{background:var(--t4)}.dot.t5{background:var(--t5)}.dot.tn{background:var(--tn)}.dot.tz{background:#fff}
.tier.t1{background:var(--t1);color:#fff;border-color:var(--t1)}.tier.t2{background:var(--t2);color:#fff;border-color:var(--t2)}.tier.t3{background:var(--t3)}.tier.t4{background:var(--t4)}.tier.t5{background:var(--t5)}.tier.tn{background:var(--tn)}.tier.tz{background:#fff}
.src{color:var(--grey-txt);font-size:12px}
.src b{color:var(--ink2);font-weight:700}
.src code{font:inherit;background:#f1f1f1;padding:1px 5px;border-radius:2px}
.ghost{height:110px;border:1px dashed #cfcfcf;background:repeating-linear-gradient(135deg,#fafafa,#fafafa 8px,#f2f2f2 8px,#f2f2f2 16px);display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;margin-top:10px}
.ghost.tall{height:220px}
.btn{display:inline-block;padding:6px 12px;border:1px solid #bbb;background:#fff;border-radius:3px;font-size:12px;font-weight:700;color:#333;cursor:pointer}
.btn.p{background:#fff;border-color:#2a84d9;color:#2a84d9}
.kpi{display:flex;gap:14px}
.kpi .k{flex:1;background:#fff;border:1px solid var(--line);padding:12px}
.kpi .k .n{font-size:30px;color:var(--teal);font-weight:400;line-height:1}
.kpi .k .l{font-size:12px;color:var(--ink2);margin-top:6px}
.kpi .k a{display:block;margin-top:8px;font-weight:700;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;background:#f3f3f3;border-bottom:1px solid var(--line);padding:7px 8px;font-weight:700}
table.t td{padding:7px 8px;border-bottom:1px solid #eee}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;font-weight:700}
.pill.due{background:#fde8ee;color:#8c1538}.pill.today{background:#fff3d6;color:#7a5300}.pill.wk{background:#e6f4f2;color:#0d4f4a}
.notice{padding:8px 0;border-bottom:1px solid #eee;font-size:12.5px}.notice:last-child{border-bottom:0}
.notice .d{color:var(--grey-txt);font-size:12px}
.fav a{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px}.fav a span{color:#999;font-size:12px}
#helpdrawer{position:fixed;top:50px;right:-380px;width:380px;bottom:0;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.08);z-index:15;transition:right .15s;display:flex;flex-direction:column}
#helpdrawer.open{right:0}
#helpdrawer .hh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
#helpdrawer .hb{padding:14px 16px;overflow:auto;font-size:13px}
#helpdrawer .hb .qq{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;color:var(--ink)}
#helpdrawer .hb .qq:hover{background:#f6f9fc;text-decoration:none}
#helpdrawer .hb input{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:3px;font:inherit;margin-bottom:12px}
.footer{margin-top:40px;border-top:1px solid #ccc;padding-top:10px;color:#777;font-size:12px;text-align:center}
.areas a{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px;font-weight:700}.areas a:last-child{border-bottom:0}.areas a span{font-weight:400;color:#555;font-size:12px}
@media (max-width:900px){#side{display:none}#main{margin-left:0;padding:60px 14px 30px}#top .logo{width:auto;padding-left:12px}#tabs li a{padding:0 7px;font-size:12px}.g2,.g3,.g4{grid-template-columns:1fr}.kpi{flex-wrap:wrap}}
</style>
</head>

function renderSide(area, path){

  const eff = nodes => { const k = nodes[nodes.length-1]; return single(k) ? [...nodes, k.kids[0]] : nodes; };
  const item = (nodes, cls='') => { nodes = eff(nodes); const ks = nodes.map(n=>slug(n.name)).join('/'); const k = nodes[nodes.length-1]; const open = cur.startsWith(ks);

  main.innerHTML = h + `<div class="footer">Cadency Edinburgh - Copyright © 2026 Trintech, Inc. All rights reserved. · Mock-up of the proposed navigation; screens are placeholders.</div>`;

  window.scrollTo(0,0);
}
document.getElementById('usermenu').innerHTML = USERMENU.kids.map(k=>`<a href="#">${k.name}</a>`).join('');
document.getElementById('user').addEventListener('click', e => { e.currentTarget.classList.toggle('open'); });
document.getElementById('toggle').addEventListener('click', () => document.getElementById('side').classList.toggle('closed'));
function openAbout(){ const d = document.getElementById('helpdrawer'); d.dataset.about = '1'; d.querySelector('.hh span').textContent = 'About this mock-up';
  document.getElementById('helpbody').innerHTML = `<p><b>What this is.</b> The proposed Cadency navigation, drawn in today's look and feel so the structure can be judged on its own. The nine areas are the top tabs; each area's menu is on the left.</p><p><b>Home is the one new screen.</b> It replaces the R2R Console and the configurable Home with what the research asked for: the areas you use, your favorites, notices, then the work that needs you.</p><p><b>Every other screen is a placeholder.</b> It names the screen, says where it lives in Cadency today, and gives its Pendo visitor tier over 90 days. The screens themselves do not change; only their place in the menu does.</p><p><b>Help.</b> The ? opens one help panel from every screen, with Beacon's chat inside it. The help experience is the integrated help initiative; this mock-up only gives it a place.</p><p style="color:#777">Structure from the Nov 20 proposal. <a href="nav-redesign-draft.html">Full mapping and reasons</a> · <a href="index.html">The pitch</a> · <a href="sitemap.html">Interactive sitemap</a></p>`;
  d.classList.add('open'); }
document.getElementById('about').addEventListener('click', openAbout);
function openHelp(){ const r = route(); const path = find(r); const name = path.length ? path[path.length-1].name : 'Home';
  const d = document.getElementById('helpdrawer'); delete d.dataset.about; d.querySelector('.hh span').textContent = 'Help';
  document.getElementById('helpbody').innerHTML = `<input placeholder="Ask about ${name}…"><div style="font-weight:700;margin-bottom:8px">People ask on ${name}</div><a class="qq" href="#">What does each status mean here?</a><a class="qq" href="#">Why is a button greyed out for me?</a><a class="qq" href="#">Show me how to complete this task</a>`;
  document.getElementById('helpdrawer').classList.add('open'); }
document.getElementById('helpbtn').addEventListener('click', openHelp);
document.getElementById('helpclose').addEventListener('click', e => { e.preventDefault(); document.getElementById('helpdrawer').classList.remove('open'); });
addEventListener('hashchange', render); render();
</script>
